services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-secops}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secops}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    init: true
    environment: &backend-environment
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-secops}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-secops}
      API_KEY: ${API_KEY:?API_KEY is required}
      INGEST_API_KEY: ${INGEST_API_KEY:?INGEST_API_KEY is required}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_ORIGINS: ${DASHBOARD_ORIGINS:-http://localhost:5000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-Bug}
      JIRA_PRIORITY_CRITICAL: ${JIRA_PRIORITY_CRITICAL:-}
      JIRA_PRIORITY_HIGH: ${JIRA_PRIORITY_HIGH:-}
      JIRA_PRIORITY_MEDIUM: ${JIRA_PRIORITY_MEDIUM:-}
      JIRA_PRIORITY_LOW: ${JIRA_PRIORITY_LOW:-}
      JIRA_PRIORITY_INFO: ${JIRA_PRIORITY_INFO:-}
      CORS_ORIGINS: ${DASHBOARD_ORIGINS:-http://localhost:5000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      MAX_SCAN_BYTES: ${MAX_SCAN_BYTES:-10485760}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      MAX_IMPORT_REQUEST_BYTES: ${MAX_IMPORT_REQUEST_BYTES:-12582912}
      MAX_FINDINGS_PER_IMPORT: ${MAX_FINDINGS_PER_IMPORT:-10000}
      IMPORT_TIMEOUT_SECONDS: ${IMPORT_TIMEOUT_SECONDS:-900}
      STORE_RAW_SCAN_DATA: ${STORE_RAW_SCAN_DATA:-false}
      ALLOW_UNVERIFIED_PARSERS: ${ALLOW_UNVERIFIED_PARSERS:-false}
      ALLOW_INSECURE_NO_AUTH: "false"
      NOTIFICATION_POLL_SECONDS: ${NOTIFICATION_POLL_SECONDS:-5}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  notification-worker:
    build:
      context: ../backend
    restart: unless-stopped
    init: true
    environment: *backend-environment
    command: ["sh", "-c", "python -m app.deployment && exec python -m app.notifications.worker"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.notifications.worker", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      args:
        NODE_MAJOR: ${FRONTEND_NODE_MAJOR:-24}
    restart: unless-stopped
    init: true
    environment:
      BACKEND_URL: http://backend:8000
      DASHBOARD_ORIGINS: ${DASHBOARD_ORIGINS:-http://localhost:5000}
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:5000:5000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5000/_health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
