name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secops
          POSTGRES_PASSWORD: secops-ci-password-00000000000000000000
          POSTGRES_DB: secops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secops -d secops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://secops:secops-ci-password-00000000000000000000@127.0.0.1:5432/secops_ci
      TEST_DATABASE_URL: postgresql://secops:secops-ci-password-00000000000000000000@127.0.0.1:5432/secops_ci
      API_KEY: ci-admin-key-00000000000000000000000000000000
      INGEST_API_KEY: ci-ingest-key-0000000000000000000000000000000
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: python -m compileall -q app
      - run: pip-audit -r requirements.txt

  frontend:
    name: ${{ matrix.node-version == '24' && 'frontend' || 'frontend (Node 26)' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "26"]
    defaults:
      run:
        working-directory: frontend
    env:
      API_KEY: ci-admin-key-00000000000000000000000000000000
      BACKEND_URL: http://127.0.0.1:8000
      DASHBOARD_USERNAME: ci-user
      DASHBOARD_PASSWORD: ci-dashboard-password-000000000000000000
      DASHBOARD_ORIGINS: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:integration
      - run: npm audit --audit-level=high
      - name: Local launcher regression tests
        run: cd .. && python3 -m unittest discover -s scripts -p test_local.py -v
      - name: Local quickstart and restart persistence
        run: cd .. && SECOPS_LOCAL_SMOKE_TEST=1 python3 scripts/check_local.py

  containers:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: secops-ci
      POSTGRES_PASSWORD: ci-postgres-password-00000000000000000000
      API_KEY: ci-admin-key-00000000000000000000000000000000
      INGEST_API_KEY: ci-ingest-key-0000000000000000000000000000000
      DASHBOARD_USERNAME: ci-user
      DASHBOARD_PASSWORD: ci-dashboard-password-000000000000000000
      DASHBOARD_ORIGINS: http://localhost:5000
      SECOPS_SMOKE_TEST: "1"
      SECOPS_ENV_FILE: /dev/null
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t secops-backend ./backend
      - run: docker build -t secops-frontend ./frontend
      - name: Build optional Node 26 frontend
        run: docker build --build-arg NODE_MAJOR=26 -t secops-frontend-node26 ./frontend
      - run: docker compose -f infra/docker-compose.yml up --build --wait --wait-timeout 120
      - run: python3 infra/smoke.py
      - run: infra/backup.sh /tmp/secops-ci.dump
      - run: SECOPS_EXPECTED_FINDINGS=1 SECOPS_EXPECTED_COMMENTS=1 infra/verify-restore.sh /tmp/secops-ci.dump
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail 100
      - if: always()
        run: docker compose -f infra/docker-compose.yml down --volumes
