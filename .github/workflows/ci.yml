name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secops
          POSTGRES_PASSWORD: secops-ci-password
          POSTGRES_DB: secops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secops -d secops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://secops:secops-ci-password@127.0.0.1:5432/secops_ci
      TEST_DATABASE_URL: postgresql://secops:secops-ci-password@127.0.0.1:5432/secops_ci
      API_KEY: ci-test-api-key
      INGEST_API_KEY: ci-test-ingest-api-key
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - run: alembic upgrade head
      - run: pytest -q
      - run: python -m compileall -q app
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      API_KEY: ci-test-api-key
      BACKEND_URL: http://127.0.0.1:8000
      DASHBOARD_USERNAME: ci-user
      DASHBOARD_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t secops-backend ./backend
      - run: docker build -t secops-frontend ./frontend
