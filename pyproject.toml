[project]
name = "secops-dashboard"
version = "0.1.0"
description = "Security finding ingestion, normalization, triage, and risk dashboard"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.19.2",
    "defusedxml==0.7.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.5",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.52",
    "starlette==1.6.0",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "pytest==9.1.1",
]
