[project]
name = "secops-dashboard"
version = "0.6.0"
description = "Security finding ingestion, normalization, triage, and risk dashboard"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "defusedxml==0.7.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "psycopg2-binary==2.9.13",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "sqlalchemy==2.1.1",
    "starlette==1.7.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
]
